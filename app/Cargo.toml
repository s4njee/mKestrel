[package]
name = "mkestral"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "mkestral"

[[bin]]
name = "mkestral"
path = "src/main.rs"

[dependencies]
mk-core.workspace = true
mk-vfs.workspace = true
mk-ui.workspace = true
async-trait = "0.1"
dioxus = { workspace = true, features = ["default", "desktop"] }

[features]
default = ["desktop"]
# Platform feature flags consumed by the dioxus-cli (`dx serve --platform …`).
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
